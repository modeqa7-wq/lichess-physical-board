<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chess Control Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        /* Status Section */
        .status-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .status-label {
            color: #aaa;
            font-size: 0.9rem;
        }

        .status-value {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .status-value.active {
            color: #4caf50;
        }

        .status-value.waiting {
            color: #ff9800;
        }

        .status-value.error {
            color: #f44336;
        }

        /* Timer Section */
        .timers {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .timer-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .timer-label {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .timer-value {
            font-size: 2rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .timer-box.you {
            border: 2px solid #4caf50;
        }

        .timer-box.opponent {
            border: 2px solid #ff9800;
        }

        /* Moves Section */
        .moves-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            max-height: 120px;
            overflow-y: auto;
        }

        .moves-title {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 10px;
        }

        .moves-list {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* Buttons */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #2196f3, #1565c0);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #ff9800, #e65100);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f44336, #c62828);
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Connection indicators */
        .connections {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .connection {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #888;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f44336;
        }

        .dot.connected {
            background: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>♟️ Chess Control</h1>

        <!-- Connection Status -->
        <div class="connections">
            <div class="connection">
                <div class="dot" id="cameraDot"></div>
                <span>Camera</span>
            </div>
            <div class="connection">
                <div class="dot" id="lichessDot"></div>
                <span>Lichess</span>
            </div>
        </div>

        <!-- Game Status -->
        <div class="status-card">
            <div class="status-row">
                <span class="status-label">Status</span>
                <span class="status-value" id="gameStatus">Idle</span>
            </div>
            <div class="status-row">
                <span class="status-label">Playing as</span>
                <span class="status-value" id="myColor">-</span>
            </div>
            <div class="status-row">
                <span class="status-label">Last Move</span>
                <span class="status-value" id="lastMove">-</span>
            </div>
        </div>

        <!-- Timers -->
        <div class="timers">
            <div class="timer-box you">
                <div class="timer-label">Your Time</div>
                <div class="timer-value" id="myTime">10:00</div>
            </div>
            <div class="timer-box opponent">
                <div class="timer-label">Opponent</div>
                <div class="timer-value" id="oppTime">10:00</div>
            </div>
        </div>

        <!-- Moves -->
        <div class="moves-card">
            <div class="moves-title">Recent Moves</div>
            <div class="moves-list" id="movesList">No moves yet</div>
        </div>

        <!-- Control Buttons -->
        <div class="button-group">
            <button class="btn btn-primary" onclick="newBotGame()">
                🤖 Play vs Bot
            </button>
            <button class="btn btn-warning" onclick="seekHumanGame()">
                👤 Play vs Human
            </button>
            <button class="btn btn-secondary" onclick="resetBaseline()">
                🔄 Reset Board
            </button>
            <button class="btn btn-danger" onclick="resignGame()">
                ❌ Resign
            </button>
        </div>
    </div>

    <!-- Bot Game Modal -->
    <div id="botModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>🤖 Play vs Bot</h3>
            <label>AI Level (1-8)</label>
            <input type="range" id="botLevel" min="1" max="8" value="3" oninput="updateLevelLabel()">
            <span id="levelLabel">Level 3</span>
            <br><br>
            <label>Your Color</label>
            <div class="color-picker">
                <button class="color-btn selected" id="colorWhite" onclick="selectColor('white')">⬜ White</button>
                <button class="color-btn" id="colorBlack" onclick="selectColor('black')">⬛ Black</button>
            </div>
            <br>
            <button class="btn btn-primary" onclick="startBotGame()">Start Game</button>
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <style>
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #00d4ff;
        }

        .modal-content label {
            color: #aaa;
            font-size: 0.9rem;
        }

        .modal-content input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }

        .color-picker {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .color-btn {
            padding: 12px 20px;
            border: 2px solid #444;
            border-radius: 8px;
            background: transparent;
            color: white;
            cursor: pointer;
        }

        .color-btn.selected {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.2);
        }

        .modal-content .btn {
            margin-top: 10px;
        }
    </style>

    <div class="toast" id="toast"></div>

    <script>
        // Format seconds to MM:SS
        function formatTime(seconds) {
            if (seconds < 0) seconds = 0;
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Show toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Update UI with game state
        function updateUI(state) {
            // Connection dots
            document.getElementById('cameraDot').classList.toggle('connected', state.camera_connected);
            document.getElementById('lichessDot').classList.toggle('connected', state.lichess_connected);

            // Status
            const statusEl = document.getElementById('gameStatus');
            statusEl.textContent = state.status;
            statusEl.className = 'status-value';
            if (state.is_my_turn) {
                statusEl.classList.add('active');
            } else if (state.game_id) {
                statusEl.classList.add('waiting');
            }

            // Color
            document.getElementById('myColor').textContent = state.my_color ? state.my_color.charAt(0).toUpperCase() + state.my_color.slice(1) : '-';

            // Last move
            document.getElementById('lastMove').textContent = state.last_opponent_move || '-';

            // Timers
            document.getElementById('myTime').textContent = formatTime(state.my_time);
            document.getElementById('oppTime').textContent = formatTime(state.opponent_time);

            // Moves list
            const moves = state.moves || [];
            if (moves.length > 0) {
                // Format as pairs
                let html = '';
                for (let i = 0; i < moves.length; i += 2) {
                    const moveNum = Math.floor(i / 2) + 1;
                    const white = moves[i] || '';
                    const black = moves[i + 1] || '';
                    html += `${moveNum}. ${white} ${black}  `;
                }
                document.getElementById('movesList').textContent = html.trim() || 'No moves yet';
            } else {
                document.getElementById('movesList').textContent = 'No moves yet';
            }
        }

        // Fetch status from server
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const state = await response.json();
                updateUI(state);
            } catch (e) {
                console.error('Failed to fetch status:', e);
            }
        }

        // Selected color for new game
        let selectedColor = 'white';

        // Open bot game modal
        function newBotGame() {
            document.getElementById('botModal').style.display = 'flex';
        }

        // Close modal
        function closeModal() {
            document.getElementById('botModal').style.display = 'none';
        }

        // Update level label
        function updateLevelLabel() {
            const level = document.getElementById('botLevel').value;
            document.getElementById('levelLabel').textContent = 'Level ' + level;
        }

        // Select color
        function selectColor(color) {
            selectedColor = color;
            document.getElementById('colorWhite').classList.toggle('selected', color === 'white');
            document.getElementById('colorBlack').classList.toggle('selected', color === 'black');
        }

        // Start bot game
        async function startBotGame() {
            const level = parseInt(document.getElementById('botLevel').value);
            closeModal();
            showToast('Starting bot game...');

            try {
                const response = await fetch('/api/new_game', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ level: level, color: selectedColor, vs_bot: true })
                });
                const result = await response.json();
                showToast(result.message);
            } catch (e) {
                showToast('Failed to start game');
            }
        }

        // Seek human game (placeholder - would need Lichess seek implementation)
        async function seekHumanGame() {
            showToast('Human seek not yet implemented. Use Play vs Bot!');
        }

        // Reset Baseline
        async function resetBaseline() {
            try {
                const response = await fetch('/api/reset_baseline', { method: 'POST' });
                const result = await response.json();
                showToast(result.message);
            } catch (e) {
                showToast('Failed to reset');
            }
        }

        // Resign
        async function resignGame() {
            if (!confirm('Are you sure you want to resign?')) return;

            try {
                const response = await fetch('/api/resign', { method: 'POST' });
                const result = await response.json();
                showToast(result.message);
            } catch (e) {
                showToast('Failed to resign');
            }
        }

        // Poll for updates every second
        setInterval(fetchStatus, 1000);
        fetchStatus(); // Initial fetch
    </script>
</body>

</html>
